[project]
name = "surf-mcp"
version = "0.5.0"
description = "MCP server for visual browser automation via Fara"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Shane Cantwell" }
]
keywords = ["mcp", "browser-automation", "visual-grounding", "fara", "playwright"]

dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "google-generativeai>=0.3.0",
    "pillow>=10.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",  # For LM Studio server probing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
harness = [
    "streamlit>=1.30.0",
]

[project.scripts]
surf-mcp = "surf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surf_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # What the test REQUIRES to run:
    "docker: requires Docker image built (docker build --target prod -t surf-mcp .)",
    "browser: requires Chromium browser (in Docker container or locally installed)",
    "llm: requires LLM server running (LM Studio at localhost:1234 or GOOGLE_API_KEY set)",

    # DEPRECATED - use combinations of above instead:
    "integration: (deprecated) use @pytest.mark.docker instead",
    "live: (deprecated) use @pytest.mark.llm instead",
]
